<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlgoWealth Admin</title>
<style>
  :root { --blue:#2C67FF; --dark:#323232; --gray:#787878; --border:#E2E8F0; --bg:#F7F8FA; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; background:var(--bg); color:var(--dark); display:flex; min-height:100vh; }
  aside { width:230px; background:#fff; border-right:1px solid var(--border); padding:24px 14px; display:flex; flex-direction:column; gap:4px; }
  aside .logo { font-weight:700; font-size:18px; margin-bottom:20px; padding-left:10px; }
  aside .logo span { color:var(--blue); }
  aside a { display:block; padding:10px 12px; border-radius:10px; color:var(--dark); text-decoration:none; font-size:15px; }
  aside a.active { background:var(--blue); color:#fff; }
  aside a:hover:not(.active) { background:var(--bg); }
  aside .bottom { margin-top:auto; }
  main { flex:1; padding:36px 44px; max-width:980px; }
  h1 { font-size:24px; margin-bottom:20px; }
  .msg { background:#EAF0FF; border:1px solid var(--blue); color:var(--dark); padding:10px 14px; border-radius:10px; margin-bottom:18px; font-size:14px; }
  .pw { background:#EAFBF0; border:1px solid #25A64E; padding:12px 14px; border-radius:10px; margin-bottom:18px; font-size:15px; }
  .pw code { font-size:17px; font-weight:700; }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--gray); margin:10px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=date], select, textarea {
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; }
  button, .btn { background:var(--blue); color:#fff; border:0; border-radius:22px; padding:10px 22px; font-size:15px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.danger { background:#EB3945; }
  button.ghost { background:transparent; color:var(--blue); border:1px solid var(--blue); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--gray); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:10px; border-bottom:1px solid var(--border); }
  .row { display:flex; gap:12px; align-items:end; flex-wrap:wrap; }
  .row > div { flex:1; min-width:160px; }
  .chip { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; background:var(--bg); }
  .chip.published { background:#EAFBF0; color:#25A64E; }
  .chip.draft { background:#FFF4E5; color:#B8860B; }
</style>
</head>
<body>
<aside>
  <div class="logo">Algo<span>Wealth</span></div>
  <a href="/admin/upload" class="{{ 'active' if active=='upload' else '' }}">Upload Files</a>
  <a href="/admin/posts" class="{{ 'active' if active=='posts' else '' }}">Blog Post</a>
  <a href="/admin/users" class="{{ 'active' if active=='users' else '' }}">Users</a>
  <a href="/admin/resets" class="{{ 'active' if active=='resets' else '' }}">Password resets</a>
  <div class="bottom"><a href="/admin/logout">Logout</a></div>
</aside>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
