{% extends "admin/layout.html" %}
{% block content %}
<h1>{{ 'Edit Post' if post else 'Create Post' }}</h1>
<div class="card">
  <form method="post" action="/admin/posts/save" enctype="multipart/form-data" id="postForm">
    <input type="hidden" name="post_id" value="{{ post.id if post else '' }}">
    <input type="hidden" name="content_json" id="content_json">
    <label>Post title</label>
    <input type="text" name="title" required value="{{ post.title if post else '' }}">
    <label>Category</label>
    <select name="type">
      <option value="stock_ideas" {% if post and post.type=='stock_ideas' %}selected{% endif %}>Stock ideas</option>
      <option value="reports" {% if post and post.type=='reports' %}selected{% endif %}>Reports</option>
    </select>
    <label>Content</label>
    <div id="editorjs" style="border:1px solid #E2E8F0;border-radius:10px;padding:8px 14px;background:#fff;min-height:220px"></div>
    <label>Cover image</label>
    <input type="file" name="image" accept="image/*">
    {% if post and post.image_path %}<div style="font-size:12px;color:#787878">Current: {{ post.image_path }}</div>{% endif %}
    <label>Attachment (PDF etc.)</label>
    <input type="file" name="attachment">
    {% if post and post.file_path %}<div style="font-size:12px;color:#787878">Current: {{ post.file_path }}</div>{% endif %}
    <div style="margin-top:20px;display:flex;gap:10px">
      <button type="submit" name="action" value="publish">Publish</button>
      <button type="submit" name="action" value="draft" class="ghost">Save as draft</button>
      <a class="btn" style="background:transparent;color:#787878" href="/admin/posts">Cancel</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2/dist/editorjs.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2/dist/header.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2/dist/editorjs-list.umd.min.js"></script>
<script>
const initial = {{ content_json | tojson }};
const editor = new EditorJS({
  holder: 'editorjs',
  tools: {
    header: { class: Header, config: { levels: [1, 2, 3], defaultLevel: 2 } },
    list: { class: EditorjsList },
  },
  data: initial ? JSON.parse(initial) : undefined,
  placeholder: 'Write here…',
});
document.getElementById('postForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = await editor.save();
  document.getElementById('content_json').value = JSON.stringify(data);
  const action = e.submitter ? e.submitter.value : 'draft';
  const hidden = document.createElement('input');
  hidden.type = 'hidden'; hidden.name = 'action'; hidden.value = action;
  e.target.appendChild(hidden);
  e.target.submit();
});
</script>
{% endblock %}
